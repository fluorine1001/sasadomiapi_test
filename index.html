<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사사도미 상벌점 및 면학 신청 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div id="login-section" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-800">Sasadomi</h2>
      <p class="text-sm text-slate-400 mt-1">비공식 기숙사 서비스</p>
    </div>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">학번 (11자리)</label>
        <input type="text" id="studentId" placeholder="s2026010701" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">기숙사 시스템 비밀번호</label>
        <input type="password" id="studentPw" placeholder="••••••••" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
      </div>
      <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
        로그인 및 시스템 접속
      </button>
    </form>
  </div>

  <div id="dashboard-section" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl hidden space-y-6">
    <div class="flex justify-between items-center border-b border-slate-100 pb-4">
      <div>
        <h2 class="text-xl font-bold text-slate-800" id="user-info">학생 현황</h2>
        <p class="text-sm text-slate-400">성공적으로 연동되었습니다.</p>
      </div>
      <button id="logout-btn" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg transition">연동 해제</button>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="bg-green-50 p-4 rounded-xl border border-green-100 text-center">
        <p class="text-sm font-medium text-green-600">누적 상점 총점</p>
        <p class="text-3xl font-black text-green-700 mt-1" id="merit-score">0점</p>
      </div>
      <div class="bg-red-50 p-4 rounded-xl border border-red-100 text-center">
        <p class="text-sm font-medium text-red-600">누적 벌점 총점</p>
        <p class="text-3xl font-black text-red-700 mt-1" id="demerit-score">0점</p>
      </div>
    </div>

    <div class="bg-slate-50 p-6 rounded-xl border border-slate-100">
      <h3 class="text-md font-bold text-slate-700 mb-4 flex items-center gap-1.5">
        📝 자율학습 대행 신청
      </h3>
      <form id="study-form" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">신청 날짜</label>
            <input type="date" id="study-date" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">교시 (시간대)</label>
            <select id="study-time" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
              <option value="">교시 선택 (로딩 중...)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">학습 장소</label>
            <select id="study-place" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
              <option value="">장소 선택 (로딩 중...)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">지도 교사 <span id="teacher-required-badge" class="text-red-500 hidden">*</span></label>
            <select id="study-teacher" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">교사 선택 (로딩 중...)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">기타 사유 (선택)</label>
          <input type="text" id="study-reason" placeholder="지정 면학 사유 등 입력" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button type="submit" id="study-submit-btn" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 rounded-lg text-sm transition shadow-sm">
          학교 시스템에 신청 보내기
        </button>
      </form>
    </div>

    <div>
      <h3 class="text-md font-bold text-slate-700 mb-3">상벌점 상세 히스토리</h3>
      <div class="overflow-hidden border border-slate-100 rounded-xl">
        <ul id="history-list" class="divide-y divide-slate-100 max-h-48 overflow-y-auto">
          <li class="p-4 text-center text-slate-400 text-sm">목록이 비어있습니다.</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
